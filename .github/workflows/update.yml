name: U17 Daten von Handball.net abrufen

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python & Camoufox installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten laden
        run: |
          pip install camoufox[geoip] beautifulsoup4
          python -m camoufox fetch

      - name: Team 87025 (Vergangene + Kommende Spiele) abrufen
        run: |
          python - << 'EOF'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from camoufox.sync_api import Camoufox

          # Wir übergeben zusätzlich dateFrom=2026-08-01, damit auch vergangene Spiele geladen werden
          URL = "https://www.handball.net/team/87025?season_id=2627&dateFrom=2026-08-01&from=2026-08-01"
          all_lines = []
          api_responses = []

          with Camoufox(headless=True) as browser:
              page = browser.new_page()

              # Fängt alle Hintergrund-Datenpakete von handball.net ab
              def on_response(response):
                  try:
                      if "json" in response.headers.get("content-type", ""):
                          api_responses.append({
                              "url": response.url,
                              "data": response.json()
                          })
                  except Exception:
                      pass

              page.on("response", on_response)
              page.goto(URL, wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(3000)

              # 1. Cookie-Banner akzeptieren ("Accept all" war in deiner data.json zu sehen!)
              for text in ["Accept all", "Alle akzeptieren", "Akzeptieren", "Save + Exit"]:
                  try:
                      btn = page.locator(f"button:has-text('{text}')").first
                      if btn.is_visible(timeout=1500):
                          btn.click()
                          page.wait_for_timeout(1500)
                          break
                  except Exception:
                      pass

              # 2. Speichere zuerst die aktuellen/kommenden Zeilen
              text_current = page.inner_text("body")
              lines_current = [l.strip() for l in text_current.split('\n') if l.strip()]

              # 3. Versuche "Frühere Spiele" / Rückwärts-Pfeil / Datum wählen zu triggern
              lines_past = []
              for trigger in ["Frühere Spiele", "Vergangene Spiele", "Mehr laden", "Vorherige"]:
                  try:
                      el = page.locator(f"button:has-text('{trigger}'), a:has-text('{trigger}')").first
                      if el.is_visible(timeout=1000):
                          el.click()
                          page.wait_for_timeout(2500)
                          text_past = page.inner_text("body")
                          lines_past = [l.strip() for l in text_past.split('\n') if l.strip()]
                          break
                  except Exception:
                      pass

              # 4. Falls "Datum wählen" ein Button mit Links-Pfeil daneben ist: Klicke den Pfeil links neben "Datum wählen"
              if not lines_past:
                  try:
                      date_btn = page.locator("text=Datum wählen").first
                      if date_btn.is_visible(timeout=1500):
                          # Suche nach vorherigem Button im gleichen Container (Pfeil zurück)
                          prev_btn = date_btn.locator("xpath=preceding-sibling::button[1] | ../preceding-sibling::button[1]").first
                          if prev_btn.is_visible(timeout=1000):
                              prev_btn.click()
                              page.wait_for_timeout(3000)
                              text_past = page.inner_text("body")
                              lines_past = [l.strip() for l in text_past.split('\n') if l.strip()]
                  except Exception:
                      pass

          # Kombiniere vergangene und kommende Zeilen ohne Duplikate der Spiele
          combined_lines = lines_past + ["--- TRENNUNG ---"] + lines_current if lines_past else lines_current

          now_de = datetime.now(ZoneInfo("Europe/Berlin")).strftime("%d.%m.%Y, %H:%M Uhr")

          output = {
              "team": "Rhein-Neckar Löwen U17 (mB)",
              "liga": "Jugendbundesliga B-Jugend - Vorrunde 7",
              "updated": now_de,
              "raw_lines": combined_lines,
              "api_urls": [r["url"] for r in api_responses],
              "api_data": api_responses
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          EOF

      - name: data.json im Repository speichern
        run: |
          git config user.name "RNL-Live-Bot"
          git config user.email "bot@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update RNL U17 inkl. vergangener Spiele" && git pull --rebase && git push)
