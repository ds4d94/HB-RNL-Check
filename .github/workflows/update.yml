name: U17 Daten von Handball.net abrufen

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python & Camoufox installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten laden
        run: |
          pip install camoufox[geoip] beautifulsoup4
          python -m camoufox fetch

      - name: Team 87025 (Komplette Saison abrufen)
        run: |
          python - << 'EOF'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from camoufox.sync_api import Camoufox

          # Erzwingt den Abruf ab Saisonbeginn (August 2026), damit auch vergangene Spiele geladen werden
          URL = "https://www.handball.net/team/87025?season_id=2627&dateFrom=2026-08-01"

          with Camoufox(headless=True) as browser:
              page = browser.new_page()
              page.goto(URL, wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(4000)

              # Cookie-Banner ("Accept all") wegklicken, falls er das Laden blockiert
              for text in ["Accept all", "Alle akzeptieren", "Akzeptieren", "Save + Exit"]:
                  try:
                      btn = page.locator(f"button:has-text('{text}')").first
                      if btn.is_visible(timeout=1500):
                          btn.click()
                          page.wait_for_timeout(1500)
                          break
                  except Exception:
                      pass

              # Einmal nach oben und unten scrollen, damit alle Lazy-Loading-Einträge der Tabelle gerendert werden
              page.evaluate("window.scrollTo(0, 0)")
              page.wait_for_timeout(1000)
              page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
              page.wait_for_timeout(2000)

              text = page.inner_text("body")

          lines = [l.strip() for l in text.split('\n') if l.strip()]

          now_de = datetime.now(ZoneInfo("Europe/Berlin")).strftime("%d.%m.%Y, %H:%M Uhr")

          output = {
              "team": "Rhein-Neckar Löwen U17 (mB)",
              "liga": "Jugendbundesliga B-Jugend - Vorrunde 7",
              "updated": now_de,
              "raw_lines": lines
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          EOF

      - name: data.json im Repository speichern
        run: |
          git config user.name "RNL-Live-Bot"
          git config user.email "bot@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update RNL U17 inkl. Historie" && git pull --rebase && git push)
