<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RNL U17">
  <title>RNL U17 Live</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body, html {
      height: 100vh;
      width: 100vw;
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .app-header {
      background-color: #161b22;
      padding: max(env(safe-area-inset-top), 18px) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }

    .title-group { text-align: center; flex: 1; }
    .app-title { color: #facc15; font-weight: 700; font-size: 1.1rem; }
    .app-subtitle { color: #8b949e; font-size: 0.75rem; margin-top: 2px; }

    .icon-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #facc15;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }

    .tab-bar {
      background-color: #161b22;
      padding: 8px 14px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #30363d;
    }

    .tab-btn {
      flex: 1;
      background-color: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #facc15;
      color: #0d1117;
      border-color: #facc15;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px calc(env(safe-area-inset-bottom) + 24px);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .match-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.68rem;
    }
    .badge.done { background: rgba(63, 185, 80, 0.18); color: #3fb950; }
    .badge.upcoming { background: rgba(250, 204, 21, 0.18); color: #facc15; }

    .teams-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .team { flex: 1; font-size: 0.92rem; font-weight: 600; }
    .team.rnl { color: #facc15; font-weight: 700; }
    .team.away { text-align: right; }

    .score-box {
      background: #21262d;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      min-width: 70px;
      text-align: center;
      border: 1px solid #30363d;
    }

    .raw-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.85rem;
    }

    .raw-line {
      padding: 7px 0;
      border-bottom: 1px solid #21262d;
      color: #c9d1d9;
    }
    .raw-line.rnl-line { color: #facc15; font-weight: 700; }
    .raw-line.score-line { color: #3fb950; font-weight: 700; font-size: 0.95rem; }

    .info-msg {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #8b949e;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-header">
    <a href="https://www.handball.net/team/87025?season_id=2627" target="_blank" class="icon-btn" title="Original öffnen">↗</a>
    <div class="title-group">
      <div class="app-title">Rhein-Neckar Löwen U17</div>
      <div class="app-subtitle">Live-Abruf via Camoufox</div>
    </div>
    <button class="icon-btn" onclick="loadLiveJson()" title="Neu laden">↻</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('cards', this)">Erkannte Spiele</button>
    <button class="tab-btn" onclick="switchTab('raw', this)">Kompletter Seiten-Abruf</button>
  </div>

  <div class="content">
    <div class="status-bar">
      <span id="sync-status">Prüfe data.json...</span>
      <span>Team 87025</span>
    </div>

    <div id="view-cards">
      <div id="matches-container"></div>
    </div>

    <div id="view-raw" class="hidden">
      <div class="raw-box" id="raw-container"></div>
    </div>
  </div>

  <script>
    async function loadLiveJson() {
      const statusEl = document.getElementById('sync-status');
      const matchesEl = document.getElementById('matches-container');
      const rawEl = document.getElementById('raw-container');

      statusEl.innerText = 'Lade data.json...';

      try {
        // Lädt ausschließlich die von der GitHub Action erzeugte Datei
        const response = await fetch('./data.json?nocache=' + Date.now());
        if (!response.ok) {
          throw new Error('data.json wurde im Repo noch nicht erstellt (HTTP ' + response.status + ')');
        }

        const data = await response.json();
        statusEl.innerText = 'Letzter Abruf: ' + (data.updated || 'Unbekannt');

        // 1. Komplette Textzeilen im zweiten Tab rendern
        const lines = data.raw_lines || [];
        rawEl.innerHTML = lines.map(l => {
          const isRnl = l.includes('Löwen');
          const isScore = /^\d{1,2}\s*:\s*\d{1,2}$/.test(l);
          return `<div class="raw-line ${isRnl ? 'rnl-line' : ''} ${isScore ? 'score-line' : ''}">${l}</div>`;
        }).join('');

        // 2. Dynamisch erkannte Spiele als Karten rendern
        const matches = data.matches || [];
        if (matches.length > 0) {
          matchesEl.innerHTML = matches.map(m => `
            <div class="match-card">
              <div class="match-meta">
                <span>${m.date || 'Spieltag'}</span>
                <span class="badge ${m.status === 'BEENDET' ? 'done' : 'upcoming'}">${m.status}</span>
              </div>
              <div class="teams-row">
                <div class="team ${m.home.includes('Löwen') ? 'rnl' : ''}">${m.home}</div>
                <div class="score-box">${m.score}</div>
                <div class="team away ${m.away.includes('Löwen') ? 'rnl' : ''}">${m.away}</div>
              </div>
            </div>
          `).join('');
        } else {
          // Falls handball.net das Layout ändert, zeige direkt den gefilterten Live-Stream um "Rhein-Neckar Löwen"
          const rnlBlocks = [];
          lines.forEach((line, idx) => {
            if (line.includes('Löwen')) {
              const snippet = lines.slice(Math.max(0, idx - 3), Math.min(lines.length, idx + 4)).join(' · ');
              rnlBlocks.push(snippet);
            }
          });

          if (rnlBlocks.length > 0) {
            matchesEl.innerHTML = rnlBlocks.map(b => `<div class="match-card">${b}</div>`).join('');
          } else {
            matchesEl.innerHTML = `<div class="info-msg">Daten geladen, aber keine Spiele im Text gefunden. Schau oben rechts in den Tab "Kompletter Seiten-Abruf", um zu sehen, was handball.net geliefert hat.</div>`;
          }
        }

      } catch (err) {
        statusEl.innerText = 'Warte auf ersten GitHub-Action-Lauf';
        matchesEl.innerHTML = `
          <div class="info-msg">
            <strong>Noch keine <code>data.json</code> gefunden!</strong><br><br>
            Damit die Spiele echt und dynamisch geladen werden, muss dein GitHub-Action-Job (aus deinem Screenshot) einmal komplett grün durchlaufen.<br><br>
            1. Aktiviere in GitHub unter <em>Settings → Actions → General → Workflow permissions</em> die Option <strong>Read and write permissions</strong>.<br>
            2. Starte den Job in der GitHub-App erneut.
          </div>
        `;
      }
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-cards').classList.toggle('hidden', tab !== 'cards');
      document.getElementById('view-raw').classList.toggle('hidden', tab !== 'raw');
    }

    loadLiveJson();
  </script>
</body>
</html>
