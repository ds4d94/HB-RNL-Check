<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RNL U17">
  <title>RNL U17 Live</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body, html {
      height: 100vh;
      width: 100vw;
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .app-header {
      background-color: #161b22;
      padding: max(env(safe-area-inset-top), 18px) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }

    .title-group { text-align: center; flex: 1; }
    .app-title { color: #facc15; font-weight: 700; font-size: 1.1rem; }
    .app-subtitle { color: #8b949e; font-size: 0.75rem; margin-top: 2px; }

    .icon-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #facc15;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px calc(env(safe-area-inset-bottom) + 24px);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #3fb950;
      margin-right: 6px;
    }

    .match-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .match-card.highlight {
      border-color: #facc15;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.15);
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.3px;
    }
    .badge.done { background: rgba(63, 185, 80, 0.18); color: #3fb950; }
    .badge.next { background: #facc15; color: #0d1117; }
    .badge.upcoming { background: rgba(250, 204, 21, 0.15); color: #facc15; }
    .badge.live { background: rgba(248, 81, 73, 0.25); color: #f85149; }

    .teams-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .team {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .team.rnl { color: #facc15; font-weight: 700; }
    .team.away { text-align: right; }

    .score-box {
      background: #21262d;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.98rem;
      min-width: 74px;
      text-align: center;
      border: 1px solid #30363d;
      white-space: nowrap;
    }

    .card-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.73rem;
      color: #8b949e;
    }

    .expand-hint {
      color: #facc15;
      font-weight: 600;
      font-size: 0.72rem;
    }

    .details-drawer {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #30363d;
      font-size: 0.8rem;
    }

    .match-card.open .details-drawer {
      display: block;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      row-gap: 8px;
      column-gap: 10px;
      margin-bottom: 12px;
    }

    .detail-label { color: #8b949e; }
    .detail-val { color: #f0f6fc; font-weight: 500; }

    .detail-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .action-link {
      flex: 1;
      text-align: center;
      background: #21262d;
      border: 1px solid #30363d;
      color: #facc15;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <a href="https://www.handball.net/team/87025?season_id=2627" target="_blank" class="icon-btn" title="Auf Handball.net öffnen">↗</a>
    <div class="title-group">
      <div class="app-title" id="team-title">Rhein-Neckar Löwen U17</div>
      <div class="app-subtitle" id="liga-title">JBLH mB · Vorrunde 7</div>
    </div>
    <button class="icon-btn" onclick="loadLiveJson()" title="Aktualisieren">↻</button>
  </div>

  <div class="content">
    <div class="status-bar">
      <span><span class="status-dot"></span><span id="sync-status">Lade Live-Daten...</span></span>
      <span>Antippen für Details</span>
    </div>

    <div id="matches-container"></div>
  </div>

  <script>
    function cleanVenue(rawVenue) {
      if (!rawVenue) return 'Nicht verfügbar';
      return rawVenue.replace(/\s*\([^)]+\)$/, '');
    }

    function parseMatchesFromLines(lines) {
      const matches = [];
      const seenIds = new Set();
      let nextMarked = false;

      for (let i = 0; i < lines.length; i++) {
        if (lines[i] === "Spielbeginn" && i >= 4) {
          const fullDate = lines[i + 1] || "";
          const awayTeam = lines[i - 1] || "";
          
          let centerBox = "";
          let homeTeam = "";
          let rawStatus = "";

          if (lines[i - 2] === "UHR") {
            centerBox = lines[i - 3] + " Uhr";
            homeTeam = lines[i - 4] || "";
            rawStatus = lines[i - 6] || "ANSTEHEND";
          } else if (lines[i - 3] === ":") {
            centerBox = `${lines[i - 4]} : ${lines[i - 2]}`;
            homeTeam = lines[i - 5] || "";
            rawStatus = lines[i - 7] || "BEENDET";
          } else {
            centerBox = lines[i - 2] || "vs.";
            homeTeam = lines[i - 3] || "";
            rawStatus = lines[i - 5] || "BEENDET";
          }

          let venue = "Nicht verfügbar";
          let roundInfo = "Vorrunde 7";
          let referees = "Nicht verfügbar";
          let spectators = "Nicht verfügbar";
          let matchId = "";

          for (let j = i + 1; j < Math.min(lines.length, i + 15); j++) {
            if (lines[j] === "Halle" && lines[j + 1]) venue = cleanVenue(lines[j + 1]);
            if (lines[j] === "Staffel / Runde" && lines[j + 1]) roundInfo = lines[j + 1];
            if (lines[j] === "Schiedsrichter" && lines[j + 1]) referees = lines[j + 1];
            if (lines[j] === "Zuschauer" && lines[j + 1]) spectators = lines[j + 1];
            if (lines[j] === "Spielnummer" && lines[j + 1]) {
              matchId = lines[j + 1];
