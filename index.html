<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RNL U17 Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { height: 100vh; width: 100vw; background: #0d1117; color: #f0f6fc; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .app-header { background: #161b22; padding: max(env(safe-area-inset-top), 18px) 16px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    .title-group { text-align: center; flex: 1; }
    .app-title { color: #facc15; font-weight: 700; font-size: 1.1rem; }
    .app-subtitle { color: #8b949e; font-size: 0.75rem; margin-top: 2px; }
    .icon-btn { background: #21262d; border: 1px solid #30363d; color: #facc15; border-radius: 8px; width: 36px; height: 36px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
    .content { flex: 1; overflow-y: auto; padding: 14px 14px 40px; }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.75rem; color: #8b949e; margin-bottom: 12px; }
    .match-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 12px; cursor: pointer; }
    .match-card.highlight { border-color: #facc15; box-shadow: 0 0 12px rgba(250, 204, 21, 0.15); }
    .match-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #8b949e; margin-bottom: 10px; }
    .badge { padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.68rem; background: rgba(250, 204, 21, 0.15); color: #facc15; }
    .badge.next { background: #facc15; color: #0d1117; }
    .badge.done { background: rgba(63, 185, 80, 0.18); color: #3fb950; }
    .teams-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .team { flex: 1; font-size: 0.9rem; font-weight: 600; }
    .team.rnl { color: #facc15; font-weight: 700; }
    .team.away { text-align: right; }
    .score-box { background: #21262d; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 0.95rem; min-width: 74px; text-align: center; border: 1px solid #30363d; }
    .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid #21262d; display: flex; justify-content: space-between; font-size: 0.73rem; color: #8b949e; }
    .details-drawer { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #30363d; font-size: 0.8rem; line-height: 1.6; color: #c9d1d9; }
    .match-card.open .details-drawer { display: block; }
    .action-link { display: inline-block; margin-top: 8px; margin-right: 8px; background: #21262d; border: 1px solid #30363d; color: #facc15; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
  </style>
</head>
<body>

  <div class="app-header">
    <a href="https://www.handball.net/team/87025?season_id=2627" target="_blank" class="icon-btn">↗</a>
    <div class="title-group">
      <div class="app-title" id="team-title">Rhein-Neckar Löwen U17</div>
      <div class="app-subtitle" id="liga-title">JBLH mB · Vorrunde 7</div>
    </div>
    <button class="icon-btn" onclick="loadLiveJson()">↻</button>
  </div>

  <div class="content">
    <div class="status-bar">
      <span id="sync-status">Starte Skript...</span>
      <span>Antippen für Details</span>
    </div>
    <div id="matches-container"></div>
  </div>

  <script>
    function parseMatches(lines) {
      const matches = [];
      let nextMarked = false;

      for (let i = 0; i < lines.length; i++) {
        if (lines[i] === "Spielbeginn" && i >= 4) {
          const date = lines[i + 1] || "";
          const away = lines[i - 1] || "";
          let score = lines[i - 2] || "vs.";
          let home = lines[i - 3] || "";
          let status = lines[i - 5] || "ANSTEHEND";

          if (lines[i - 2] === "UHR") {
            score = lines[i - 3] + " Uhr";
            home = lines[i - 4] || "";
            status = lines[i - 6] || "ANSTEHEND";
          } else if (lines[i - 3] === ":") {
            score = lines[i - 4] + " : " + lines[i - 2];
            home = lines[i - 5] || "";
            status = "BEENDET";
          }

          let venue = "Halle folgt", refs = "Nicht verfügbar", specs = "Nicht verfügbar", id = "";
          for (let j = i + 1; j < Math.min(lines.length, i + 14); j++) {
            if (lines[j] === "Halle") venue = (lines[j + 1] || "").replace(/\s*\([^)]+\)$/, '');
            if (lines[j] === "Schiedsrichter") refs = lines[j + 1] || "";
            if (lines[j] === "Zuschauer") specs = lines[j + 1] || "";
            if (lines[j] === "Spielnummer") { id = lines[j + 1] || ""; break; }
          }

          const isNext = (status.includes("ANSTEHEND") && !nextMarked);
          if (isNext) nextMarked = true;

          matches.push({ date, home, away, score, venue, refs, specs, id, isNext, status: isNext ? "NÄCHSTES SPIEL" : status });
        }
      }
      return matches;
    }

    async function loadLiveJson() {
      const statusEl = document.getElementById('sync-status');
      const container = document.getElementById('matches-container');
      statusEl.innerText = 'Rufe data.json ab...';

      try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        statusEl.innerText = 'Sync: ' + (data.updated || 'Aktiv');
        const matches = parseMatches(data.raw_lines || []);

        if (matches.length === 0) {
          container.innerHTML = '<div class="match-card">Keine Spiele in data.json erkannt. Zeilenanzahl: ' + (data.raw_lines ? data.raw_lines.length : 0) + '</div>';
          return;
        }

        container.innerHTML = matches.map(m => `
          <div class="match-card ${m.isNext ? 'highlight open' : ''}" onclick="this.classList.toggle('open')">
            <div class="match-meta">
              <span>${m.date}</span>
              <span class="badge ${m.isNext ? 'next' : (m.status === 'BEENDET' ? 'done' : '')}">${m.status}</span>
            </div>
            <div class="teams-row">
              <div class="team ${m.home.includes('LÖWEN') ? 'rnl' : ''}">${m.home}</div>
              <div class="score-box">${m.score}</div>
              <div class="team away ${m.away.includes('LÖWEN') ? 'rnl' : ''}">${m.away}</div>
            </div>
            <div class="card-footer">
              <span>📍 ${m.venue}</span>
              <span style="color:#facc15">Details ▾</span>
            </div>
            <div class="details-drawer">
              <div><strong>Halle:</strong> ${m.venue}</div>
              <div><strong>Schiedsrichter:</strong> ${m.refs}</div>
              <div><strong>Zuschauer:</strong> ${m.specs}</div>
              <div><strong>Spielnummer:</strong> ${m.id}</div>
              <a href="https://maps.apple.com/?q=${encodeURIComponent(m.venue)}" target="_blank" class="action-link" onclick="event.stopPropagation()">🗺️ Route</a>
              <a href="https://www.handball.net/team/87025?season_id=2627" target="_blank" class="action-link" onclick="event.stopPropagation()">📋 Spielbericht</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        statusEl.innerText = 'Fehler: ' + err.message;
        container.innerHTML = '<div class="match-card">Fehler beim Laden: ' + err.message + '</div>';
      }
    }

    loadLiveJson();
  </script>
</body>
</html>
