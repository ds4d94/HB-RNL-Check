<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RNL Live">
  <title>RNL Live App</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100vh;
      width: 100vw;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    /* Simuliert eine native iOS-App-Leiste im Dark Mode */
    .app-header {
      background-color: #161b22;
      padding-top: max(env(safe-area-inset-top), 20px);
      padding-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      border-bottom: 1px solid #30363d;
      z-index: 10;
    }

    .app-title {
      color: #facc15;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    /* Lädt die originale Webseite nahtlos in den unteren Bereich */
    iframe {
      flex-grow: 1;
      width: 100%;
      border: none;
      background-color: #ffffff; /* Hintergrund von Handball.net */
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="app-title">Rhein-Neckar Löwen</div>
  </div>

  <iframe src="https://www.handball.net/team/87025?season_id=2627" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

</body>
</html>
